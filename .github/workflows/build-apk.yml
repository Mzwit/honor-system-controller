name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Build release APK (signed if secrets are set)
        env:
          HSC_KEYSTORE_B64: ${{ secrets.HSC_KEYSTORE_B64 }}
          HSC_KEYSTORE_PASSWORD: ${{ secrets.HSC_KEYSTORE_PASSWORD }}
          HSC_KEY_ALIAS: ${{ secrets.HSC_KEY_ALIAS }}
          HSC_KEY_PASSWORD: ${{ secrets.HSC_KEY_PASSWORD }}
        run: |
          if [ -n "$HSC_KEYSTORE_B64" ]; then
            echo "$HSC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export HSC_KEYSTORE="$RUNNER_TEMP/release.jks"
            ./gradlew --no-daemon assembleRelease
          else
            echo "No signing secrets – skipping release build"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: HonorSystemController-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish APK to the apk-builds branch and the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/apk/debug/*.apk /tmp/out/HonorSystemController-debug.apk
          cd /tmp/out
          git init -q -b apk-builds
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add HonorSystemController-debug.apk
          git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
          cd "$GITHUB_WORKSPACE"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest /tmp/out/HonorSystemController-debug.apk --title "Latest debug APK" --notes "Built from ${GITHUB_SHA}" --target "${GITHUB_SHA}"
