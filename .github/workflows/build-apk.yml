name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Build release APK (signed if secrets are set)
        env:
          HSC_KEYSTORE_B64: ${{ secrets.HSC_KEYSTORE_B64 }}
          HSC_KEYSTORE_PASSWORD: ${{ secrets.HSC_KEYSTORE_PASSWORD }}
          HSC_KEY_ALIAS: ${{ secrets.HSC_KEY_ALIAS }}
          HSC_KEY_PASSWORD: ${{ secrets.HSC_KEY_PASSWORD }}
        run: |
          if [ -n "$HSC_KEYSTORE_B64" ]; then
            echo "$HSC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export HSC_KEYSTORE="$RUNNER_TEMP/release.jks"
            ./gradlew --no-daemon assembleRelease
          else
            echo "No signing secrets – skipping release build"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: HonorSystemController-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
